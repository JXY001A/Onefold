services:
  app:
    build: .
    image: ${ONEFOLD_IMAGE:-onefold}:${TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://onefold:${POSTGRES_PASSWORD:-onefold}@db:5432/onefold
      DATA_DIR: /data
    expose: ["8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onefold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onefold}
      POSTGRES_DB: onefold
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onefold -d onefold"]
      interval: 10s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # 不设时整个站点监听 :80（本地）；生产在 .env 写域名，Caddy 自动签 HTTPS
      ONEFOLD_DOMAIN: ${ONEFOLD_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [app]

volumes:
  caddy_data: {}
  pg_data: {}
